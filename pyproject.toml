[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hledger-config"
version = "0.1.0"
description = "Configuration loading, directory management, and CLI argument parsing for hledger"
requires-python = ">=3.10"
dependencies = [
    "hledger-core>=0.1.0",
    "typeguard>=2.13.3",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 80

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
